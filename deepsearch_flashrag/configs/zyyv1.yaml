model2path:
  e5: "intfloat/e5-base-v2"
  e5-large: "intfloat/e5-large-v2"
  bge: "BAAI/bge-base-en-v1.5"
  bge-reranker-large: "BAAI/bge-reranker-large"
  Qwen3-Reranker-8B: "Qwen/Qwen3-Reranker-8B"
  llama3-8B-instruct: "meta-llama/Meta-Llama-3-8B-Instruct"
  llama3-70B-instruct: "meta-llama/Meta-Llama-3-70B-Instruct"
  Qwen2.5-14B-Instruct-1M: "Qwen/Qwen2.5-14B-Instruct-1M"

model2pooling:
  e5: "mean"
  e5-large: "mean"
  bge: "cls"
  bge-reranker-large: "cls"

data_dir: "/data/bjtu_deepsearch/dataset/"
save_dir: "/data/bjtu_deepsearch/output/"
dataset_name: "deepsearch"
split: ["test"]
gpu_id: "0"
seed: 2024
save_intermediate_data: True
save_note: "deepsearch_improved"

# ========== 改进1: 提升检索质量 ==========
# 混合检索策略
retrieval_method: "hybrid"
retrieval_methods:
  - "e5"
  - "bge"
retrieval_weights:
  - 0.6
  - 0.4
retrieval_model_paths:
  - "/public/huggingface-models/intfloat/e5-base-v2"
  - "/public/huggingface-models/BAAI/bge-base-en-v1.5"
index_paths:
  - "/public/modelscope-datasets/hhjinjiajie/FlashRAG_Dataset/retrieval_corpus/wiki18_100w_e5.index"
  - "/public/modelscope-datasets/hhjinjiajie/FlashRAG_Dataset/retrieval_corpus/wiki18_100w_bge.index"
corpus_path: "/public/modelscope-datasets/hhjinjiajie/FlashRAG_Dataset/retrieval_corpus/wiki18_100w.jsonl"
retrieval_topk: 15  # 增加检索数量到15
retrieval_batch_size: 2
retrieval_use_fp16: True
retrieval_query_max_length: 512  # 大幅增加查询长度以捕获更多信息
use_retrieval_cache: False
save_retrieval_cache: False
faiss_gpu: False

# ========== 改进2: 使用更强的reranker ==========
use_reranker: True
rerank_model_name: "Qwen3-Reranker-8B"  # 使用更大的reranker模型
rerank_model_path: "/public/huggingface-models/Qwen/Qwen3-Reranker-8B"
rerank_topk: 6  # 调整保留文档数量，更聚焦高相关文档
rerank_batch_size: 2
rerank_max_length: 1024  # 增加最大长度以包含更多上下文
rerank_use_fp16: True

# ========== 改进3: 优化生成参数 ==========
framework: "fschat"
generator_model: "Qwen2.5-14B-Instruct-1M"  # 使用更强的生成模型
generator_model_path: "/public/huggingface-models/Qwen/Qwen2.5-14B-Instruct-1M"
generator_batch_size: 1  # 降低batch size确保稳定性
generator_max_input_len: 16384  # 大幅增加输入长度以容纳更多上下文
generation_params:
  temperature: 0.0  # 降至0提高确定性
  max_tokens: 256  # 减少最大token数，聚焦简洁答案
  top_p: 0.95
use_fid: False
gpu_memory_utilization: 0.9

# ========== 改进4: 使用refiner优化检索结果 ==========
refiner_name: "extractive"  # 使用extractive refiner提取关键信息
refiner_topk: 3  # 减少数量，聚焦最相关信息
refiner_pooling_method: "mean"
refiner_encode_max_length: 512  # 增加编码长度

# ========== IRCoT多轮检索配置 ==========
# 使用IRCoT多轮检索pipeline
pipeline_name: "ircot"
max_iter: 5  # 设置5轮迭代以增强多跳推理能力
active_retrieval: True  # 启用主动检索
active_retrieval_k: 3  # 每轮检索3个问题
thought_weight: 0.7  # 思考在检索中的权重
max_context_size: 4096  # 限制上下文大小
judger_name: ~  # IRCoT不需要judger
# 答案提取配置
use_answer_extractor: True
answer_extractor_method: "regex_and_keyword"
answer_pattern: '[A-Za-z][A-Za-z0-9\-_\s.]*'  # 匹配答案格式

metrics: ["em", "f1", "retrieval_recall", "retrieval_precision"]
metric_setting:
  retrieval_recall_topk: 15  # 与检索topk保持一致
  tokenizer_name: "gpt-3.5-turbo"
save_metric_score: True
# 后处理配置
post_processing:
  remove_duplicates: True  # 移除重复答案
  normalize_whitespace: True  # 标准化空白字符
  lowercase_result: False  # 保持原始大小写

test_sample_num: 25
# 提示模板配置
use_custom_prompt: True
prompt_template_path: "/root/deepsearch_flashrag/prompts/ircot_improved_prompt.py"
prompt_template_name: "IRCoTPrompt"  # 使用改进的IRCoT提示模板

