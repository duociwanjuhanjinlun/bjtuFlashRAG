model2path:
  e5: "intfloat/e5-base-v2"
  bge: "BAAI/bge-base-en-v1.5"
  bge-reranker-large: "BAAI/bge-reranker-large"
  llama3-8B-instruct: "meta-llama/Meta-Llama-3-8B-Instruct"

model2pooling:
  e5: "mean"
  bge: "cls"
  bge-reranker-large: "cls"

data_dir: "/data/bjtu_deepsearch/dataset/"
save_dir: "/data/bjtu_deepsearch/output/"
dataset_name: "deepsearch"
split: ["test"]
gpu_id: "0"
seed: 2024
save_intermediate_data: True
save_note: "deepsearch_adaptive"

retrieval_method: "e5"
retrieval_model_path: "/public/huggingface-models/intfloat/e5-base-v2" #"intfloat/e5-base-v2"
index_path: "/public/modelscope-datasets/hhjinjiajie/FlashRAG_Dataset/retrieval_corpus/wiki18_100w_e5.index"
corpus_path: "/public/modelscope-datasets/hhjinjiajie/FlashRAG_Dataset/retrieval_corpus/wiki18_100w.jsonl"
retrieval_topk: 5
retrieval_batch_size: 2  # 原: 32
retrieval_use_fp16: True
retrieval_query_max_length: 96
faiss_gpu: True

use_reranker: True
rerank_model_name: "Qwen3-Reranker-4B"
rerank_model_path: "/public/huggingface-models/Qwen/Qwen3-Reranker-4B"
rerank_topk: 5
rerank_batch_size: 4  # 原: 16

framework: "fschat"
generator_model: "llama3-8B-instruct"
#generator_model: "Qwen/Qwen2.5-7B-Instruct-GGUF"
#generator_model_path: "/public/huggingface-models/Qwen/Qwen2.5-7B-Instruct-GGUF"
generator_model_path: "/public/huggingface-models/meta-llama/Meta-Llama-3-8B"
generator_batch_size: 1  # 原: 2
generator_max_input_len: 512
generation_params:
  temperature: 0.2
  max_tokens: 300
  #do_sample: False
use_fid: False
gpu_memory_utilization: 0.6  # 原: 0.8

judger_name: "adaptive"
judger_config:
  model_path: "/public/huggingface-models/Qwen/Qwen1.5-4B-Chat-GPTQ-Int4"
  #model_path: "/public/huggingface-models/deepseek-ai/DeepSeek-R1-Distill-Qwen-7B"
  batch_size: 8
  max_length: 512

metrics: ["em", "f1"]
metric_setting:
  retrieval_recall_topk: 5 # 8
  tokenizer_name: "gpt-3.5-turbo"
save_metric_score: True

test_sample_num: 25  # 原: 100