model2path:
  e5: "intfloat/e5-base-v2"
  bge: "BAAI/bge-base-en-v1.5"
  bge-reranker-large: "BAAI/bge-reranker-large"
  Qwen3-Reranker-8B: "Qwen/Qwen3-Reranker-8B"
  llama3-8B-instruct: "meta-llama/Meta-Llama-3-8B-Instruct"

model2pooling:
  e5: "mean"
  bge: "cls"
  bge-reranker-large: "cls"

data_dir: "/data/bjtu_deepsearch/dataset/"
save_dir: "/data/bjtu_deepsearch/output/"
dataset_name: "deepsearch"
split: ["test"]
gpu_id: "0"
seed: 2024
save_intermediate_data: True
save_note: "deepsearch_improved"

# ========== 改进1: 提升检索质量 ==========
retrieval_method: "e5"
retrieval_model_path: "/public/huggingface-models/intfloat/e5-base-v2"
index_path: "/public/modelscope-datasets/hhjinjiajie/FlashRAG_Dataset/retrieval_corpus/wiki18_100w_e5.index"
corpus_path: "/public/modelscope-datasets/hhjinjiajie/FlashRAG_Dataset/retrieval_corpus/wiki18_100w.jsonl"
retrieval_topk: 10  # 增加检索数量，从5提升到10
retrieval_batch_size: 4
retrieval_use_fp16: True
retrieval_query_max_length: 128  # 增加查询长度以捕获更多信息
use_retrieval_cache: False
save_retrieval_cache: False
faiss_gpu: False

# ========== 改进2: 使用更强的reranker ==========
use_reranker: True
rerank_model_name: "Qwen3-Reranker-8B"  # 使用更大的reranker模型
rerank_model_path: "/public/huggingface-models/Qwen/Qwen3-Reranker-8B"
rerank_topk: 8  # rerank后保留更多文档
rerank_batch_size: 4
rerank_max_length: 512
rerank_use_fp16: True

# ========== 改进3: 优化生成参数 ==========
framework: "fschat"
generator_model: "llama3-8B-instruct"
generator_model_path: "/public/huggingface-models/meta-llama/Meta-Llama-3-8B"
generator_batch_size: 1  # 降低batch size确保稳定性
generator_max_input_len: 2048  # 增加输入长度以容纳更多上下文
generation_params:
  temperature: 0.1  # 降低temperature提高确定性
  max_tokens: 512  # 增加最大token数
  top_p: 0.9
use_fid: False
gpu_memory_utilization: 0.85

# ========== 改进4: 使用refiner优化检索结果 ==========
refiner_name: "extractive"  # 使用extractive refiner提取关键信息
refiner_topk: 5
refiner_pooling_method: "mean"
refiner_encode_max_length: 256

# ========== 改进5: 使用多轮检索pipeline ==========
# 注意：如果要使用IRCoT，需要设置judger_name为None或使用其他pipeline
judger_name: ~  # 暂时不使用judger，直接使用多轮检索

metrics: ["em", "f1"]
metric_setting:
  retrieval_recall_topk: 10
  tokenizer_name: "gpt-3.5-turbo"
save_metric_score: True

test_sample_num: 25

